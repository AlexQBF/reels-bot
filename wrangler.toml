name = "reels-bot"
main = "src/worker.js"
compatibility_date = "2026-10-01"

[vars]
# API-адреса cobalt-инстансов через запятую. Перебираются по порядку.
# Проверить живость: см. README. Менять можно в дашборде Cloudflare без редеплоя.
# Зеркала InstaFix (ddinstagram / kkinstagram): отдают прямую ссылку на видео через og:video.
INSTAFIX_HOSTS = "www.ddinstagram.com,www.kkinstagram.com"
COBALT_INSTANCES = "https://cobaltapi.squair.xyz,https://cobalt-api.clxxped.lol,https://rue-cobalt.xenon.zone,https://cobaltapi.cjs.nz"

# Секреты (Cloudflare → Settings → Variables and Secrets):
#   BOT_TOKEN        — токен от @BotFather
#   WEBHOOK_SECRET   — любая случайная строка (защита вебхука)
#   ALLOWED_USER_ID  — если задан, бот отвечает только этому пользователю; пустой — всем
#   OWNER_ID         — ваш id; только ему доступна команда /stats

# KV-хранилище для учёта пользователей. Создать: Storage & Databases → KV → Create,
# имя reels-bot-users, затем вставить его ID сюда вместо ЗАМЕНИТЬ_НА_ID.
[[kv_namespaces]]
binding = "USERS"
id = "ЗАМЕНИТЬ_НА_ID"
